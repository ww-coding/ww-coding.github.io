<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">Codex 与 Git 的关系</title>
  <desc id="desc">Codex 修改文件，Git 负责记录版本，用户确认后提交</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#fff;stroke:#d9e2ec;stroke-width:2}
      .git{fill:#eef2ff;stroke:#818cf8}
      .codex{fill:#ecfeff;stroke:#22d3ee}
      .user{fill:#fef9c3;stroke:#facc15}
      .head{font:700 22px Arial,"Microsoft YaHei",sans-serif;fill:#111827}
      .text{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#4b5563}
      .mono{font:15px Consolas,monospace;fill:#334155}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="320" rx="18"/>
  <text x="40" y="48" class="head">Codex 不替代 Git，而是在 Git 仓库里工作</text>
  <g transform="translate(54 95)">
    <rect class="user" width="190" height="130" rx="14"/>
    <text x="28" y="42" class="head" font-size="19">你</text>
    <text x="28" y="76" class="text">提出需求</text>
    <text x="28" y="104" class="text">确认是否提交</text>
  </g>
  <path class="arrow" d="M258 160 H325"/>
  <g transform="translate(340 95)">
    <rect class="codex" width="230" height="130" rx="14"/>
    <text x="28" y="42" class="head" font-size="19">Codex</text>
    <text x="28" y="76" class="text">读代码、改文件</text>
    <text x="28" y="104" class="text">运行检查并解释 diff</text>
  </g>
  <path class="arrow" d="M584 160 H650"/>
  <g transform="translate(665 95)">
    <rect class="git" width="250" height="130" rx="14"/>
    <text x="28" y="42" class="head" font-size="19">Git</text>
    <text x="28" y="76" class="mono">status / diff</text>
    <text x="28" y="104" class="mono">add / commit / push</text>
  </g>
  <text x="54" y="270" class="text">安全顺序：先看状态，再修改，再检查 diff，最后由你决定是否提交。</text>
</svg>
